name: Wiz sensor
description: >-
  Starts the Wiz GitHub runner sensor on Linux runners when WIZ_SENSOR_ENABLED
  is true and WIZ_SENSOR_TOKEN is set. Otherwise it no-ops, so the sensor can
  be turned off by changing the org variable.

inputs:
  enabled:
    description: >-
      Value of vars.WIZ_SENSOR_ENABLED. The sensor starts only when this is
      the string true.
    required: false
    default: ""
  token:
    description: >-
      Wiz sensor JSON token from secrets.WIZ_SENSOR_TOKEN. An empty value
      skips the sensor.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Skip Wiz sensor
      if: runner.os != 'Linux' || inputs.enabled != 'true' || inputs.token == ''
      shell: bash
      env:
        WIZ_SENSOR_ENABLED: ${{ inputs.enabled }}
        WIZ_SENSOR_TOKEN_SET: ${{ inputs.token != '' }}
        WIZ_RUNNER_OS: ${{ runner.os }}
      run: |
        if [ "$WIZ_RUNNER_OS" != "Linux" ]; then
          echo "::notice title=Wiz sensor::Skipped because the runner OS is ${WIZ_RUNNER_OS}."
        elif [ "$WIZ_SENSOR_ENABLED" != "true" ]; then
          echo "::notice title=Wiz sensor::Skipped because WIZ_SENSOR_ENABLED is not true."
        else
          echo "::notice title=Wiz sensor::Skipped because WIZ_SENSOR_TOKEN is not set."
        fi

    # The pinned action puts parsed token fields in `docker run --env` and
    # includes that command line in the error it throws. GitHub masks the
    # JSON secret as a whole, not those fields, so register them first.
    - name: Mask Wiz sensor token fields
      id: mask-wiz-sensor-token
      if: runner.os == 'Linux' && inputs.enabled == 'true' && inputs.token != ''
      continue-on-error: true
      shell: bash
      env:
        WIZ_SENSOR_TOKEN: ${{ inputs.token }}
      run: |
        node <<'NODE'
        const raw = process.env.WIZ_SENSOR_TOKEN || "";
        let token;
        try {
          token = JSON.parse(raw);
        } catch {
          console.log("::notice title=Wiz sensor::Token is not JSON, so no field masks were registered.");
          process.exit(0);
        }
        if (token === null || typeof token !== "object" || Array.isArray(token)) {
          console.log("::notice title=Wiz sensor::Token is not a JSON object, so no field masks were registered.");
          process.exit(0);
        }
        const keys = [
          "registry-username",
          "registry-password",
          "wiz-api-client-id",
          "wiz-api-client-secret",
        ];
        for (const key of keys) {
          const value = token[key];
          if (typeof value !== "string" || value.length === 0) {
            continue;
          }
          const encoded = value
            .replace(/%/g, "%25")
            .replace(/\r/g, "%0D")
            .replace(/\n/g, "%0A");
          process.stdout.write(`::add-mask::${encoded}\n`);
        }
        NODE

    - name: Start Wiz sensor
      if: runner.os == 'Linux' && inputs.enabled == 'true' && inputs.token != '' && steps.mask-wiz-sensor-token.outcome == 'success'
      continue-on-error: true
      uses: wiz-sec-public/wiz-sensor-github-action@2f72488477988739561233bbc10ceff0c53273fd # main, 2026-09-30
      with:
        token: ${{ inputs.token }}
        tag: github_runner_private_preview
        wait-for-ready: "true"
        allow-self-hosted: "false"
